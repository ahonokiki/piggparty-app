name: ガチャ背景の履歴を更新（毎週）
on:
  schedule:
    - cron: '53 5 * * 6'   # 毎週土曜 14:53（日本時間）。公式サイトのお知らせ（コラボガチャなど）を見る
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save --no-package-lock sharp@0.33
      # 普通のガチャは公式サイトに載らないので、アプリか tools/gacha-bg/add.mjs で手で入れる
      - run: node tools/gacha-bg/update-piggparty.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A bg-auto
          git diff --cached --quiet || (git commit -m "ガチャ背景の履歴を更新" && git pull --rebase && git push)
